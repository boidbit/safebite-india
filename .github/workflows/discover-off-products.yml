name: Discover Open Food Facts Products

# Phase 1 of the seeding pipeline: walks Open Food Facts by food CATEGORY
# (biscuits, snacks, beverages, ...) and saves real India-tagged products
# (name, brand, ingredients, image) into the `products` table. No AI here
# at all -- see generate-reports.yml for the separate job that turns
# these into scored reports. Splitting the two means a Gemini slowdown
# never blocks new products from being found and saved; discovery just
# runs at full Open Food Facts speed every time.
#
# This used to walk a fixed list of ~42 brand names instead -- that hit a
# hard ceiling once every brand's own catalog was fully walked, since a
# brand list can only ever be as big as whoever maintains it. Category
# tags aren't tied to a brand list, so this doesn't run into that same
# wall, and it also picks up smaller/regional brands the old list never
# had a search term for.
#
# Runs on GitHub Actions (free and effectively unlimited on a public
# repo) since there's no Netlify site anymore.
#
# LOOPS INTERNALLY every 30 minutes instead of relying on the `schedule:`
# trigger below to fire on time -- measured via the real run history on
# this repo, GitHub's cron trigger was firing every ~4-4.5 HOURS, not
# every 30 minutes (GitHub gives scheduled/cron triggers no SLA at all;
# they're explicitly "best effort" and get deprioritized under platform
# load, especially on free-tier public repos). Fixing that would
# otherwise mean an external cron service on a timer hitting this
# workflow's dispatch API -- a third-party account and a stored GitHub
# token for something GitHub Actions can do by itself. Instead: once a
# run DOES start (whenever GitHub gets around to it), it keeps working
# every 30 minutes internally for up to ~5h40m (just under the 6-hour
# hard cap GitHub puts on every job, no matter the repo or plan) before
# exiting clean. Since new sessions were observed starting well inside
# that 5h40m window, sessions chain into each other and real work ends up
# happening close to every 30 minutes almost continuously, without any
# new account or credential.

on:
  # PAUSED 5 Oct 2026: every Open Food Facts category was already finished, yet
  # this kept running (each run loops for ~5h40m) and, with Generate Product
  # Reports, sent thousands of requests a day to Supabase -- the free plan's
  # egress and log limits were passed. To resume, uncomment these two lines.
  # schedule:
  #   - cron: '*/30 * * * *'
  # Adds a "Run workflow" button on the Actions tab for running it on demand.
  workflow_dispatch:
    inputs:
      category:
        description: 'Only this category, run once (leave blank to loop through all every 30 min)'
        required: false

concurrency:
  # Queue rather than run two sessions at once -- two loops hitting the
  # same seed_progress cursors in parallel could race each other.
  group: discover-off-products
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # GitHub's hard per-job cap is 360 minutes regardless of what's set
    # here -- this just leaves a few minutes of headroom for setup/exit
    # rather than getting killed mid-step.
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Supabase's client needs native WebSocket support, which is
          # only stable from Node 22 onward -- Node 20 fails immediately
          # with "native WebSocket not found".
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Discover, every 30 minutes until the job's own time runs out
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            # A specific category via "Run workflow" is a one-off manual
            # test -- run it once and exit, don't loop for hours.
            node scripts/discover-off-products.js --category "${{ github.event.inputs.category }}"
            exit 0
          fi

          BUDGET_SECONDS=$((340 * 60))  # 5h40m -- inside the 355m job timeout
          PASS=1
          while [ "$SECONDS" -lt "$BUDGET_SECONDS" ]; do
            echo "=== Pass $PASS (${SECONDS}s into this session) ==="
            node scripts/discover-off-products.js
            PASS=$((PASS + 1))

            REMAINING=$((BUDGET_SECONDS - SECONDS))
            if [ "$REMAINING" -le 0 ]; then break; fi
            SLEEP=$((REMAINING < 1800 ? REMAINING : 1800))
            echo "Sleeping ${SLEEP}s before the next pass..."
            sleep "$SLEEP"
          done
          echo "Session budget used up -- exiting clean. The next scheduled trigger picks this back up."
