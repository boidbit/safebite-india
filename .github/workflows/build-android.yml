name: Build Android APK

# Builds a debug APK of the app (via Capacitor, wrapping the same React
# app that runs on GitHub Pages) and publishes it to a rolling GitHub
# Release, so there's always one stable link to download the latest
# build from on a phone -- no Play Store account or signing keystore
# needed for this, since it's a debug build meant for sideloading onto
# your own device rather than store distribution.
#
# Manual only (not on every push) -- an Android build takes real CI
# minutes and isn't needed until you actually want a fresh APK.
#
# Also builds a signed release AAB (the format Play Store actually
# requires) -- but ONLY once a signing keystore is added as the
# ANDROID_KEYSTORE_BASE64 secret (see android/app/build.gradle's
# signingConfigs.release for how it's read, and the repo's Play Store
# setup notes for how to generate + add that secret). Until then this
# step is skipped, not failed, so the debug APK above still builds and
# publishes normally.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets can't be referenced directly in a step's `if:` (GitHub
    # rejects the whole workflow file at parse time if you try -- this
    # broke every run since the release-AAB steps below were added,
    # confirmed live via three straight 0-job "failure" runs). A
    # job-level env var computed from the secret is the documented
    # workaround: it IS readable from `if:` once steps start.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build web assets for the native app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        # Capacitor serves the build from its own local root, not a
        # GitHub Pages subpath -- a separate build mode (see
        # vite.config.js) is what keeps this from loading blank.
        run: npx vite build --mode capacitor

      - name: Copy the build into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Caches the Gradle distribution + dependencies across runs --
      # without this, every single run downloaded the ~150MB Gradle
      # distribution zip fresh from services.gradle.org, which is both
      # slow and a real point of failure (confirmed live: a run failed
      # outright on "Connection reset by peer" mid-download, nothing to
      # do with this project's own code). A cached run skips that
      # download entirely once it's warmed up once.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android
        # gradlew's executable bit is now set in git, but a defensive
        # chmod costs nothing and survives anyone re-committing this
        # file from a Windows machine (which doesn't track that bit)
        # and accidentally clearing it again.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish to a rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk android/app/build/outputs/apk/debug/app-debug.apk \
            --title "FoodGuard India -- latest Android build" \
            --notes "Automatically built from the current main branch. This is a debug build for installing on your own phone (not from the Play Store), so Android will warn about an unverified app -- that's expected. On your phone: download app-debug.apk below, open it, and allow \"install from unknown sources\" if asked." \
            --latest

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release AAB (signed, for Play Store)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foodguard-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
