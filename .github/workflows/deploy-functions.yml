# Deploy the Supabase Edge Function behind the admin panel's video buttons
# (supabase/functions/video-maker) whenever its code changes -- so a change to
# it never waits for someone to paste it into the Supabase dashboard.
#
# One-time setup (Settings -> Secrets and variables -> Actions -> New secret):
#   SUPABASE_ACCESS_TOKEN -- a personal access token from the Supabase
#                            dashboard (Account -> Access Tokens -> Generate)
# The project is read from the VITE_SUPABASE_URL secret that is already there.
# Without the token this only prints a warning and the function has to be
# deployed by hand. The function's own secrets (GH_VIDEO_TOKEN) stay in the
# Supabase dashboard (Edge Functions -> Secrets), not here.
#
# Only video-maker is deployed: ai-proxy is left exactly as it is.
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/video-maker/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy video-maker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Not deployed::SUPABASE_ACCESS_TOKEN is not set -- add it as a repository secret, or deploy supabase/functions/video-maker by hand."
            exit 0
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([^.]+)\..*#\1#')
          supabase functions deploy video-maker --project-ref "$ref"
