<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodGuard India</title>
    <!-- Link preview for shared WhatsApp messages. Generic on purpose:
         a shared report's address is a #hash route, and the part after
         # never reaches the server, so every shared link gets this same
         card -- a per-product preview isn't possible on static hosting. -->
    <meta name="description" content="Scan any packaged food and see what's really in it — an ingredient score, explained, for you and your family." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FoodGuard India" />
    <meta property="og:title" content="FoodGuard India — know what's in your food" />
    <meta property="og:description" content="Scan any packaged food and see what's really in it — an ingredient score, explained, for you and your family." />
    <meta property="og:image" content="https://foodguards.space/app/favicon.png" />
    <meta property="og:url" content="https://foodguards.space/app/" />
    <!-- Google Analytics (GA4). send_page_view is off because this is a
         single-page app: src/App.jsx sends a page_view on every route
         change instead (and skips admin pages and the native Android app). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C77145W3R7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-C77145W3R7', { send_page_view: false });
    </script>
    <!-- Applies the saved theme before React (or even the CSS) has a
         chance to paint anything -- without this, a dark-mode user would
         see a flash of the light page for a moment on every load. Kept
         in sync with src/hooks/useTheme.js's storage key/logic. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('safebite-theme') || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          if (pref === 'dark' || (pref === 'system' && systemDark)) root.classList.add('dark');
          else if (pref === 'light') root.classList.add('light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
