<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- The clip short template (shorts/clip.mjs copies it into
     shorts/clip-<job>/ next to that short's timeline.json, the clip's frames
     in src/ and the app recording in app/). The real footage is underneath --
     one clip frame per video frame, moved by a camera (zoom, pan, blur, whip,
     shake) -- and the stickers, boxes, cards, the barcode scan, the phone and
     the captions are drawn over it. Every frame comes from one time value:
     window.render(t), see promo/render.cjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800;1,9..144,700&family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  * { box-sizing: border-box; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; color: #fbf7ee; background: #000; }
  .serif { font-family: Fraunces, Georgia, serif; font-weight: 800; letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* the footage */
  #cam { position: absolute; inset: 0; overflow: hidden; }
  #src { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #vignette { background: linear-gradient(rgba(0,0,0,.45), transparent 15%, transparent 70%, rgba(0,0,0,.55)); }
  #dim { background: radial-gradient(circle at 50% 35%, rgba(18,96,60,.82), rgba(8,45,28,.94) 70%); opacity: 0; }
  #flash { background: #fff; opacity: 0; }

  .brand { position: absolute; top: 56px; left: 56px; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 24px 10px 10px; border-radius: 999px; background: rgba(15,81,50,.9); font-family: Fraunces, serif; font-weight: 800; font-size: 36px; }
  .brand img { width: 52px; height: 52px; border-radius: 14px; background: #fff; }
  .brand small { font-family: 'JetBrains Mono', monospace; font-size: 17px; color: #e8a33d; letter-spacing: .16em; }
  #fine { position: absolute; left: 60px; right: 60px; bottom: 36px; z-index: 30; text-align: center; font-size: 20px; line-height: 1.35; color: rgba(255,255,255,.82); text-shadow: 0 2px 6px rgba(0,0,0,.9); }

  /* hook stickers */
  .sticker { position: absolute; left: 0; right: 0; text-align: center; z-index: 12; opacity: 0; }
  .sticker span { display: inline-block; max-width: 960px; padding: 22px 44px 28px; border-radius: 30px; border: 7px solid #1b1a17; box-shadow: 14px 14px 0 #1b1a17; font-size: 88px; line-height: 1.02; }
  #st1 { top: 190px; } #st1 span { background: #fffdf8; color: #1b1a17; }
  #st2 { top: 1180px; } #st2 span { background: #ffc24d; color: #1b1a17; }

  /* a box round a number on the label, its name beside it */
  #mark { position: absolute; border: 9px solid #ffc24d; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.42), 0 0 40px rgba(255,194,77,.95); opacity: 0; }
  #markTag { position: absolute; padding: 10px 20px; border-radius: 14px; background: #ffc24d; color: #1b1a17; font-size: 30px; white-space: nowrap; opacity: 0; box-shadow: 6px 6px 0 rgba(0,0,0,.5); }

  /* the fact cards */
  .card { position: absolute; left: 50px; right: 50px; top: 150px; padding: 28px 38px 30px; border-radius: 38px; background: #fffdf8; color: #1b1a17; border: 7px solid #1b1a17; box-shadow: 16px 16px 0 rgba(0,0,0,.5); opacity: 0; z-index: 14; }
  .card .k { font-size: 24px; color: #807a6f; }
  .bowlRow { display: flex; align-items: center; gap: 34px; margin-top: 10px; }
  .bowl { width: 300px; height: 205px; flex-shrink: 0; overflow: visible; }
  .cnt b { display: block; font-size: 170px; line-height: .9; color: #8a3b0a; }
  .cnt span { display: block; font-size: 44px; font-weight: 800; color: #1b1a17; margin-top: 8px; }
  .cnt small { display: block; font-size: 30px; color: #6b665d; margin-top: 6px; font-weight: 600; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; margin-top: 12px; text-align: center; }
  .vs .bowl { width: 250px; height: 170px; margin: 0 auto; }
  .vs .lab { font-size: 28px; font-weight: 700; color: #6b665d; margin-top: 6px; }
  .vs .n { font-size: 86px; line-height: 1; color: #8a3b0a; }
  .vs .n small { font-size: 34px; color: #1b1a17; font-family: Inter, sans-serif; font-weight: 800; margin-left: 6px; }
  .vs .mid { font-size: 52px; color: #807a6f; padding-bottom: 80px; }
  .vs .side { opacity: 0; }
  .bigV { font-size: 120px; line-height: 1; margin-top: 4px; color: #8a3b0a; }
  .card .d { font-size: 40px; font-weight: 800; color: #1b1a17; margin-top: 6px; }
  .card .f { font-size: 22px; color: #807a6f; margin-top: 10px; }
  .bar { position: relative; height: 62px; margin-top: 20px; border-radius: 999px; background: #efe7d6; border: 5px solid #1b1a17; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #ffc24d, #e8710a 70%, #d9480f); }
  .bar b { position: absolute; right: 22px; top: 6px; font-size: 38px; color: #1b1a17; font-family: Fraunces, serif; }
  .bar u { position: absolute; left: 22px; top: 12px; font-size: 24px; color: #1b1a17; text-decoration: none; font-weight: 800; }

  /* the ingredients worth a look */
  #ichips { position: absolute; left: 50px; right: 50px; top: 160px; opacity: 0; z-index: 14; }
  #ichips .head { display: inline-block; padding: 12px 22px; border-radius: 14px; background: #1b1a17; color: #ffc24d; font-size: 26px; }
  #ichips .list { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; margin-top: 18px; }
  #ichips .list span { padding: 16px 34px; border-radius: 999px; background: #fde3c4; color: #8a3b0a; font-size: 54px; font-weight: 900; border: 5px solid #1b1a17; box-shadow: 10px 10px 0 rgba(0,0,0,.45); opacity: 0; }

  /* the barcode scan */
  #scanBox { position: absolute; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.5); opacity: 0; }
  .corner { position: absolute; width: 86px; height: 86px; border: 0 solid #ffc24d; opacity: 0; filter: drop-shadow(0 0 12px rgba(255,194,77,.9)); }
  #c0 { border-top-width: 12px; border-left-width: 12px; border-top-left-radius: 22px; }
  #c1 { border-top-width: 12px; border-right-width: 12px; border-top-right-radius: 22px; }
  #c2 { border-bottom-width: 12px; border-left-width: 12px; border-bottom-left-radius: 22px; }
  #c3 { border-bottom-width: 12px; border-right-width: 12px; border-bottom-right-radius: 22px; }
  #laser { position: absolute; height: 8px; border-radius: 4px; background: #ff3b30; box-shadow: 0 0 18px 6px rgba(255,59,48,.75); opacity: 0; }
  #digits { position: absolute; left: 0; right: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 60px; letter-spacing: .12em; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,.9); opacity: 0; }
  #check { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #2fbf5f; border: 7px solid #fff; display: grid; place-items: center; font-size: 72px; font-weight: 900; color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; }

  /* the phone with the real app */
  #phoneWrap { position: absolute; left: 50%; top: 250px; width: 600px; margin-left: -300px; opacity: 0; z-index: 16; }
  #phone { padding: 20px; border-radius: 88px; background: #121212; box-shadow: 0 0 0 6px #2a2a2a, 0 40px 80px rgba(0,0,0,.55); }
  #screen { position: relative; width: 560px; border-radius: 70px; overflow: hidden; background: #f2f2f7; }
  #screen img { position: absolute; left: 0; top: 0; width: 560px; }
  #notch { position: absolute; top: 20px; left: 50%; width: 160px; height: 44px; margin-left: -80px; border-radius: 999px; background: #121212; z-index: 3; }
  #scoreSt { position: absolute; left: 640px; top: 300px; z-index: 18; padding: 22px 30px 26px; border-radius: 30px; background: #fffdf8; color: #1b1a17; border: 7px solid #1b1a17; box-shadow: 12px 12px 0 rgba(0,0,0,.45); text-align: center; opacity: 0; }
  #scoreSt b { display: block; font-size: 110px; line-height: .95; }
  #scoreSt b small { font-size: 40px; color: #807a6f; }
  #scoreSt span { display: block; font-size: 40px; font-weight: 900; margin-top: 4px; }
  #scoreSt i { display: block; font-style: normal; font-size: 26px; font-weight: 700; color: #6b665d; margin-top: 8px; }

  /* captions, word by word, the key words in saffron */
  #cc { position: absolute; left: 34px; right: 34px; top: 1540px; z-index: 25; text-align: center; font-size: 76px; font-weight: 900; line-height: 1.12; color: #fff; -webkit-text-stroke: 14px rgba(0,0,0,.92); paint-order: stroke fill; letter-spacing: -0.01em; }
  #cc span { display: inline-block; margin: 0 .13em; visibility: hidden; }
  #cc span.now { color: #ffc24d; }
  #cc span.em { color: #ffc24d; font-size: 1.14em; }

  /* the end card: the Play Store, with a QR code to scan straight off the screen */
  #cta { opacity: 0; z-index: 28; }
  #wipe { position: absolute; left: 0; right: 0; height: 2400px; background: linear-gradient(#e8a33d 0 90px, #0f5132 90px); }
  #ctaHead { position: absolute; left: 70px; right: 70px; top: 230px; text-align: center; font-size: 104px; line-height: 1.04; }
  #ctaHead em { color: #e8a33d; }
  #qrCard { position: absolute; left: 50%; top: 600px; width: 560px; margin-left: -280px; padding: 40px 40px 30px; border-radius: 48px; background: #fffdf8; border: 6px solid #1b1a17; box-shadow: 18px 18px 0 #082d1c; text-align: center; color: #1b1a17; }
  #qrCard img { width: 468px; height: 468px; display: block; margin: 0 auto; image-rendering: pixelated; }
  #qrCard p { margin: 18px 0 0; font-size: 26px; color: #4a463f; }
  #play { position: absolute; left: 50%; top: 1330px; width: 640px; margin-left: -320px; display: flex; align-items: center; gap: 30px; padding: 26px 44px; border-radius: 34px; background: #000; border: 3px solid #a6a6a6; color: #fff; }
  #play .tri { width: 0; height: 0; border-top: 42px solid transparent; border-bottom: 42px solid transparent; border-left: 70px solid #34c759; position: relative; }
  #play .txt small { display: block; font-size: 26px; letter-spacing: .08em; }
  #play .txt b { display: block; font-size: 66px; font-weight: 700; line-height: 1.05; }
  #ctaName { position: absolute; left: 70px; right: 70px; top: 1530px; text-align: center; font-size: 42px; font-weight: 700; color: #d6eadd; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="whipF" x="-25%" y="0" width="150%" height="100%"><feGaussianBlur id="whipB" stdDeviation="0 0" /></filter></svg>
<div id="stage">
  <div id="cam"><img id="src" alt="" /></div>
  <div id="vignette" class="layer"></div>
  <div id="dim" class="layer"></div>
  <div id="mark"></div>
  <div id="markTag" class="mono"></div>
  <div class="brand"><img src="/site/assets/logo.png" alt="" />FoodGuard<small>INDIA</small></div>

  <div id="st1" class="sticker"><span class="serif"></span></div>
  <div id="st2" class="sticker"><span class="serif"></span></div>

  <div id="card" class="card"></div>
  <div id="ichips"><div class="head mono">Dhyaan dene laayak</div><div class="list"></div></div>

  <div id="scanBox"></div>
  <div id="c0" class="corner"></div><div id="c1" class="corner"></div><div id="c2" class="corner"></div><div id="c3" class="corner"></div>
  <div id="laser"></div>
  <div id="digits"></div>
  <div id="check">✓</div>

  <div id="phoneWrap"><div id="phone"><div id="screen"><div id="notch"></div><img id="appImg" alt="" /></div></div></div>
  <div id="scoreSt"><b class="serif"></b><span></span><i></i></div>

  <div id="flash" class="layer"></div>

  <div id="cta" class="layer">
    <div id="wipe"></div>
    <div id="ctaHead" class="serif"></div>
    <div id="qrCard"><img src="/promo/shorts/assets/playstore-qr.png" alt="" /><p class="mono">Scan karo · Free download</p></div>
    <div id="play"><span class="tri"></span><span class="txt"><small>GET IT ON</small><b>Google Play</b></span></div>
    <div id="ctaName">FoodGuard India · foodguards.space</div>
  </div>

  <div id="cc"></div>
  <div id="fine"></div>
</div>

<script>
(async () => {
  const TL = await (await fetch('timeline.json')).json();
  const S = TL.scenes;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const back = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const within = (t, a, b, fadeIn = 0.12, fadeOut = 0.15) => clamp((t - a) / fadeIn) * (1 - clamp((t - b + fadeOut) / fadeOut));
  const TIER = { Excellent: '#2fbf5f', Good: '#8cc63f', Moderate: '#e0a100', Poor: '#f0821e', 'Very Poor': '#ef5a3c' }[TL.verdict] || '#e0a100';

  $('st1').querySelector('span').textContent = TL.hook.stickers[0] || '';
  $('st2').querySelector('span').textContent = TL.hook.stickers[1] || '';
  $('ctaHead').innerHTML = TL.cta;
  $('fine').textContent = TL.fine;
  $('digits').textContent = TL.scan ? TL.scan.code : '';
  TL.chips.forEach((c) => { const el = document.createElement('span'); el.textContent = c.text; $('ichips').querySelector('.list').appendChild(el); });
  $('scoreSt').querySelector('b').innerHTML = `${TL.score}<small>/100</small>`;
  $('scoreSt').querySelector('span').textContent = TL.verdict;
  $('scoreSt').querySelector('span').style.color = TIER;
  $('scoreSt').querySelector('i').textContent = `Khaayein? ${TL.advice}`;

  // A bowl that fills: oil (gold) or sugar (white), with a drop falling in on each teaspoon.
  const bowlSvg = (fill) => `<svg class="bowl" viewBox="0 0 300 205"><defs><clipPath id="bc${fill}"><path d="M14 58 Q150 270 286 58 Z" /></clipPath>
    <linearGradient id="g${fill}" x1="0" y1="0" x2="0" y2="1">${fill === 'oil' ? '<stop offset="0" stop-color="#ffd54a"/><stop offset="1" stop-color="#e09a00"/>' : '<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e3d6"/>'}</linearGradient></defs>
    <g clip-path="url(#bc${fill})"><rect x="0" y="0" width="300" height="205" fill="#f3efe6" /><rect class="lvl" x="0" y="205" width="300" height="205" fill="url(#g${fill})" />
    <ellipse class="surf" cx="150" cy="205" rx="140" ry="9" fill="${fill === 'oil' ? '#fff3b0' : '#ffffff'}" opacity=".8" /></g>
    <path d="M8 58 Q150 282 292 58" fill="none" stroke="#1b1a17" stroke-width="9" stroke-linecap="round" /><line x1="2" y1="58" x2="298" y2="58" stroke="#1b1a17" stroke-width="9" stroke-linecap="round" />
    <circle class="drop" cx="150" cy="-30" r="15" fill="${fill === 'oil' ? '#f2b705' : '#fffdf8'}" stroke="#1b1a17" stroke-width="4" />
    <ellipse class="ripple" cx="150" cy="200" rx="10" ry="4" fill="none" stroke="#1b1a17" stroke-width="3" opacity="0" /></svg>`;
  const levelOf = (frac) => 205 - frac * 150; // empty -> full bowl
  const setBowl = (svg, frac, dropAt, t) => {
    const y = levelOf(frac);
    svg.querySelector('.lvl').setAttribute('y', y);
    svg.querySelector('.surf').setAttribute('cy', y);
    const d = svg.querySelector('.drop');
    const r = svg.querySelector('.ripple');
    if (dropAt != null && t >= dropAt - 0.22 && t < dropAt) { d.setAttribute('cy', -30 + (y + 30) * ease((t - dropAt + 0.22) / 0.22)); d.style.opacity = 1; } else d.style.opacity = 0;
    if (dropAt != null && t >= dropAt && t < dropAt + 0.35) { const q = (t - dropAt) / 0.35; r.setAttribute('cy', y); r.setAttribute('rx', 10 + q * 90); r.setAttribute('ry', 4 + q * 10); r.setAttribute('opacity', 1 - q); } else r.setAttribute('opacity', 0);
  };

  // Output time -> clip time (a speed ramp where asked), and the camera between its keyframes.
  const segAt = (t) => TL.clip.find((s) => t >= s.t0 && t < s.t1) || TL.clip[TL.clip.length - 1];
  const srcAt = (t) => { const s = segAt(t); const u = clamp((t - s.t0) / ((s.t1 - s.t0) || 1)); return s.s0 + (s.s1 - s.s0) * (s.ease ? easeIO(u) : u); };
  const camAt = (t) => {
    const K = TL.cam;
    let a = K[0], b = K[K.length - 1];
    for (let i = 0; i < K.length; i++) { if (K[i].t <= t) a = K[i]; else { b = K[i]; break; } }
    if (a === b || b.t <= a.t) return { x: a.x, y: a.y, z: a.z, blur: a.blur || 0, whip: a.whip || 0 };
    const u = easeIO((t - a.t) / (b.t - a.t));
    const lerp = (k) => (a[k] ?? 0) + ((b[k] ?? 0) - (a[k] ?? 0)) * u;
    return { x: lerp('x'), y: lerp('y'), z: lerp('z'), blur: lerp('blur'), whip: (a.whip || 0) * (1 - clamp((t - a.t) / Math.min(0.3, b.t - a.t))) };
  };
  const SRC = $('src');
  const APP = $('appImg');
  let shownSrc = -1, shownApp = -1, cardOn = -1;
  const swap = async (img, url) => { img.src = url; try { await img.decode(); } catch (e) { /* keep the last frame */ } };

  window.render = async (t) => {
    // ---- the footage ----
    const n = Math.max(0, Math.min(TL.frames - 1, Math.round(srcAt(t) * 30)));
    const jobs = [];
    if (n !== shownSrc) { shownSrc = n; jobs.push(swap(SRC, `src/s_${String(n).padStart(4, '0')}.jpg`)); }
    const P = TL.phone;
    const u = t - P.t0;
    if (TL.app && u >= 0 && t < S.cta[0] + 0.5) {
      const k = Math.max(0, Math.min(TL.app.frames - 1, Math.floor(u * TL.app.fps)));
      if (k !== shownApp) { shownApp = k; jobs.push(swap(APP, `app/a_${String(k).padStart(4, '0')}.jpg`)); }
    } else if (!TL.app && TL.still && shownApp !== -2) { shownApp = -2; jobs.push(swap(APP, 'app-page.jpg')); }
    await Promise.all(jobs);

    const c = camAt(t);
    const seg = segAt(t);
    const frozen = seg.s0 === seg.s1;
    // A frozen frame drifts a little, like a hand holding it; impacts shake it.
    let dx = frozen ? Math.sin(t * 1.7) * 3 : 0, dy = frozen ? Math.cos(t * 1.3) * 3 : 0;
    for (const s of TL.shakes) if (t >= s && t < s + 0.45) { const a = 26 * Math.exp(-(t - s) / 0.1); dx += Math.sin((t - s) * 95) * a / c.z; dy += Math.cos((t - s) * 83) * a / c.z; }
    const z = c.z;
    const x = clamp(c.x + dx, 540 / z, 1080 - 540 / z);
    const y = clamp(c.y + dy, 960 / z, 1920 - 960 / z);
    SRC.style.transform = `translate(${540 - x * z}px, ${960 - y * z}px) scale(${z})`;
    if (c.whip > 0.6) { $('whipB').setAttribute('stdDeviation', `${c.whip} 0`); SRC.style.filter = 'url(#whipF) saturate(1.08) contrast(1.05)'; }
    else SRC.style.filter = `${c.blur > 0.3 ? `blur(${c.blur}px) ` : ''}saturate(1.08) contrast(1.05)`;
    const toScreen = (sx, sy) => [540 + (sx - x) * z, 960 + (sy - y) * z];

    $('flash').style.opacity = Math.max(
      0.8 * (t >= TL.freezeAt ? 1 - clamp((t - TL.freezeAt) / 0.16) : 0),
      P.t0 ? 0.95 * clamp(1 - Math.abs(t - P.t0) / 0.14) : 0);
    $('dim').style.opacity = 0.96 * ease((t - P.t0 + 0.05) / 0.3);
    $('fine').style.opacity = clamp((t - S.label[0]) / 0.3) * (t >= S.cta[0] ? 0 : 1);

    // ---- hook stickers: the first one is there on frame 0 ----
    const [a1, a2] = TL.hook.at;
    const st = (el, t0, t1) => {
      const inn = back((t - t0 + 0.05) / 0.32);
      el.style.opacity = within(t, t0 - 0.05, t1, 0.06, 0.12);
      el.style.transform = `scale(${0.55 + 0.45 * inn}) rotate(${(el.id === 'st1' ? -2.5 : 2) + Math.sin(t * 6) * 0.6}deg) translateY(${(1 - inn) * 40}px)`;
    };
    st($('st1'), a1, a2 - 0.22);
    st($('st2'), a2, S.hook[1]);

    // ---- the box round a number on the frozen label ----
    const m = TL.marks.find((mm) => t >= mm.t0 - 0.05 && t < mm.t1 + 0.05);
    if (m) {
      const [bx, by, bw, bh, deg = 0] = m.box;
      const [cx, cy] = toScreen(bx + bw / 2, by + bh / 2);
      const w = bw * z + 28, h = bh * z + 24;
      const inn = back((t - m.t0) / 0.32);
      const vis = within(t, m.t0, m.t1, 0.1, 0.18);
      Object.assign($('mark').style, { left: `${cx - w / 2}px`, top: `${cy - h / 2}px`, width: `${w}px`, height: `${h}px`, opacity: vis, transform: `rotate(${deg}deg) scale(${1.35 - 0.35 * inn})` });
      $('markTag').textContent = m.label;
      const tagX = Math.min(1080 - 330, cx + w / 2 + 24);
      Object.assign($('markTag').style, { left: `${tagX}px`, top: `${cy - 30}px`, opacity: vis * clamp((t - m.t0 - 0.18) / 0.12), transform: `translateX(${(1 - ease((t - m.t0 - 0.18) / 0.3)) * -40}px) rotate(${deg / 2}deg)` });
    } else { $('mark').style.opacity = 0; $('markTag').style.opacity = 0; }

    // ---- the fact cards ----
    const ki = TL.cards.findIndex((cc) => t >= cc.t0 - 0.02 && t < cc.t1 + 0.05);
    const cd = TL.cards[ki];
    const card = $('card');
    if (cd) {
      if (cardOn !== ki) {
        cardOn = ki;
        if (cd.kind === 'bowl') card.innerHTML = `<div class="k mono"></div><div class="bowlRow">${bowlSvg(cd.fill)}<div class="cnt"><b class="serif">0</b><span></span><small></small></div></div>`;
        else if (cd.kind === 'vs') card.innerHTML = `<div class="k mono">Serving vs poora pack</div><div class="vs"><div class="side">${bowlSvg(cd.fill)}<div class="n serif"></div><div class="lab"></div></div><div class="mid serif">vs</div><div class="side">${bowlSvg(cd.fill)}<div class="n serif"></div><div class="lab"></div></div></div>`;
        else card.innerHTML = '<div class="k mono"></div><div class="bigV serif"></div><div class="d"></div><div class="bar"><i></i><u>Din ki limit →</u><b>0%</b></div><div class="f"></div>';
        if (cd.kind === 'bowl') { card.querySelector('.k').textContent = cd.tag; card.querySelector('.cnt span').textContent = cd.unitWord; card.querySelector('.cnt small').textContent = cd.sub; }
        if (cd.kind === 'vs') {
          const sides = card.querySelectorAll('.side');
          [cd.a, cd.b].forEach((s, i) => { sides[i].querySelector('.n').innerHTML = `${String(s.n).replace('.5', '½')}<small>${cd.unitWord}</small>`; sides[i].querySelector('.lab').textContent = s.k; });
        }
        if (cd.kind === 'bar') { card.querySelector('.k').textContent = cd.tag; card.querySelector('.bigV').textContent = cd.v; card.querySelector('.d').textContent = cd.d; card.querySelector('.f').textContent = cd.foot || ''; }
      }
      const inn = back((t - cd.t0) / 0.38);
      card.style.opacity = within(t, cd.t0, cd.t1, 0.12, 0.18);
      card.style.transform = `translateY(${(1 - inn) * -80}px) rotate(${(1 - inn) * -3}deg) scale(${0.92 + 0.08 * inn})`;
      if (cd.kind === 'bowl') {
        const done = cd.ticks.filter((x) => t >= x).length;
        const next = cd.ticks.find((x) => t < x + 0.35);
        const total = cd.ticks.length;
        const shown = done === total ? cd.n : done;
        const num = card.querySelector('.cnt b');
        num.textContent = String(shown).replace('.5', '½');
        const lastHit = cd.ticks[done - 1];
        num.style.transform = `scale(${lastHit != null ? 1 + 0.28 * Math.exp(-(t - lastHit) / 0.08) : 1})`;
        // Each teaspoon raises the level as its drop lands.
        const frac = cd.ticks.reduce((s, x) => s + ease((t - x) / 0.25), 0) / total * 0.95;
        setBowl(card.querySelector('svg'), frac, next, t);
      }
      if (cd.kind === 'vs') {
        const sides = card.querySelectorAll('.side');
        [0, 1].forEach((i) => {
          const at = cd.t0 + 0.15 + i * 0.7;
          sides[i].style.opacity = clamp((t - at) / 0.15);
          sides[i].style.transform = `scale(${0.7 + 0.3 * back((t - at) / 0.35)})`;
          const frac = (i ? 1 : cd.a.n / cd.b.n) * 0.95 * ease((t - at - 0.1) / 0.6);
          setBowl(sides[i].querySelector('svg'), frac, null, t);
        });
      }
      if (cd.kind === 'bar') {
        const f = ease((t - cd.t0 - 0.3) / 0.9) * cd.pct;
        const over = 1 + 0.03 * Math.exp(-Math.max(0, t - cd.t0 - 1.2) / 0.12) * (t > cd.t0 + 1.2 ? 1 : 0);
        card.querySelector('.bar i').style.width = `${Math.min(100, f)}%`;
        card.querySelector('.bar b').textContent = `${Math.round(f)}%`;
        card.querySelector('.bar').style.transform = `scale(${over})`;
      }
    } else card.style.opacity = 0;

    // ---- the ingredients worth a look, each as it is said ----
    const [f0, f1] = S.facts;
    $('ichips').style.opacity = TL.chips.length ? within(t, f0 + 0.05, f1, 0.15, 0.2) : 0;
    [...$('ichips').querySelector('.list').children].forEach((el, i) => {
      const at = TL.chips[i].t;
      el.style.opacity = clamp((t - at) / 0.08);
      el.style.transform = `scale(${0.5 + 0.5 * back((t - at) / 0.32)}) rotate(${i % 2 ? 2 : -2}deg)`;
    });

    // ---- the barcode scan ----
    const sc = TL.scan;
    if (sc && t >= sc.t0 - 0.05 && t < sc.t1 + 0.1) {
      const [bx, by, bw, bh] = sc.box;
      const [X1, Y1] = toScreen(bx, by), [X2, Y2] = toScreen(bx + bw, by + bh);
      const p = 26;
      const vis = within(t, sc.t0, sc.t1, 0.1, 0.12);
      const locked = t >= sc.lock;
      const g = back((t - sc.t0) / 0.38);
      const corners = [[X1 - p, Y1 - p, 0, 0], [X2 + p - 86, Y1 - p, 1080 - 86, 0], [X1 - p, Y2 + p - 86, 0, 1920 - 86], [X2 + p - 86, Y2 + p - 86, 1080 - 86, 1920 - 86]];
      corners.forEach(([tx, ty, fx, fy], i) => {
        const el = $(`c${i}`);
        el.style.left = `${fx + (tx - fx) * g}px`; el.style.top = `${fy + (ty - fy) * g}px`;
        el.style.opacity = vis;
        el.style.borderColor = locked ? '#2fbf5f' : '#ffc24d';
        el.style.transform = `scale(${locked ? 1 + 0.12 * Math.exp(-(t - sc.lock) / 0.1) : 1})`;
      });
      Object.assign($('scanBox').style, { left: `${X1 - p}px`, top: `${Y1 - p}px`, width: `${X2 - X1 + p * 2}px`, height: `${Y2 - Y1 + p * 2}px`, opacity: vis * 0.9, background: locked ? `rgba(47,191,95,${0.35 * Math.exp(-(t - sc.lock) / 0.25)})` : 'transparent' });
      const sweep = (Math.sin((t - sc.t0) * 7) + 1) / 2;
      Object.assign($('laser').style, { left: `${X1 - 6}px`, width: `${X2 - X1 + 12}px`, top: `${Y1 + (Y2 - Y1) * sweep - 4}px`, opacity: locked ? 0 : vis * clamp((t - sc.t0 - 0.3) / 0.1) });
      const typed = Math.floor(clamp((t - sc.t0 - 0.3) / Math.max(0.2, sc.lock - sc.t0 - 0.3)) * sc.code.length);
      $('digits').textContent = sc.code.slice(0, typed) + (typed < sc.code.length ? '▌' : '');
      Object.assign($('digits').style, { top: `${Y2 + p + 26}px`, opacity: vis * clamp((t - sc.t0 - 0.3) / 0.1) });
      const ck = back((t - sc.lock) / 0.3);
      Object.assign($('check').style, { left: `${X2 + p - 70}px`, top: `${Y1 - p - 70}px`, opacity: locked ? vis : 0, transform: `scale(${0.3 + 0.7 * ck})` });
    } else {
      ['scanBox', 'c0', 'c1', 'c2', 'c3', 'laser', 'digits', 'check'].forEach((id) => { $(id).style.opacity = 0; });
    }

    // ---- the phone with the real app: it bursts out of the barcode ----
    if (u > -0.1 && t < S.cta[0] + 0.6) {
      const inn = back(u / 0.55);
      $('phoneWrap').style.opacity = clamp(u / 0.08);
      $('phoneWrap').style.transform = `scale(${0.12 + 0.88 * inn}) rotate(${(1 - inn) * -10}deg) translateY(${Math.sin(u * 1.2) * 6}px)`;
      const A = TL.app || TL.still;
      if (A) {
        const k = 560 / A.width;
        $('screen').style.height = `${Math.round((A.viewH || A.height) * k)}px`;
        // The still (no recording): eased down the page instead.
        APP.style.top = TL.app ? '0px' : `${-Math.min(A.height - A.viewH, 900 * easeIO((u - 2) / 2)) * k}px`;
      }
      const sa = TL.phone.scoreAt;
      const si = back((t - sa) / 0.4);
      $('scoreSt').style.opacity = clamp((t - sa) / 0.08) * (1 - clamp((t - S.cta[0] + 0.2) / 0.2));
      $('scoreSt').style.transform = `scale(${0.4 + 0.6 * si}) rotate(${6 + (1 - si) * 14}deg)`;
    } else { $('phoneWrap').style.opacity = 0; $('scoreSt').style.opacity = 0; }

    // ---- captions: the chunk being said, word by word ----
    let ci = -1;
    TL.captions.forEach((cc, i) => { if (cc.words[0][1] <= t) ci = i; });
    const cap = TL.captions[ci];
    const next = TL.captions[ci + 1];
    if (cap && t < Math.min(next ? next.words[0][1] : 1e9, cap.end) && t < S.cta[0] + 0.2) {
      if ($('cc').dataset.i !== String(ci)) {
        $('cc').dataset.i = String(ci);
        $('cc').innerHTML = '';
        cap.words.forEach(([w, , em]) => { const s = document.createElement('span'); s.textContent = w; if (em) s.className = 'em'; $('cc').appendChild(s); });
      }
      let wi = 0;
      [...$('cc').children].forEach((el, i) => {
        const at = cap.words[i][1];
        if (at <= t) wi = i;
        el.style.visibility = at <= t + 0.02 ? 'visible' : 'hidden';
        const q = back((t - at) / 0.22);
        el.style.transform = `scale(${0.6 + 0.4 * q}) translateY(${(1 - q) * 24}px)`;
      });
      [...$('cc').children].forEach((el, i) => el.classList.toggle('now', i === wi && !cap.words[i][2]));
      $('cc').style.opacity = 1;
    } else $('cc').style.opacity = 0;

    // ---- the end card: a saffron-edged panel wipes up; the QR stays to the end ----
    const [c0] = S.cta;
    const wv = easeIO((t - c0 + 0.3) / 0.7);
    $('cta').style.opacity = t < c0 - 0.3 ? 0 : 1;
    $('wipe').style.top = `${1920 - wv * 2010}px`;
    $('ctaHead').style.opacity = ease((t - c0 - 0.2) / 0.5);
    $('ctaHead').style.transform = `translateY(${(1 - ease((t - c0 - 0.2) / 0.5)) * 70}px)`;
    $('qrCard').style.opacity = ease((t - c0 - 0.5) / 0.35);
    $('qrCard').style.transform = `scale(${0.7 + 0.3 * back((t - c0 - 0.5) / 0.5)}) rotate(${(1 - ease((t - c0 - 0.5) / 0.5)) * -6}deg)`;
    $('play').style.opacity = ease((t - c0 - 0.9) / 0.35);
    $('play').style.transform = `translateY(${(1 - back((t - c0 - 0.9) / 0.5)) * 80}px)`;
    $('ctaName').style.opacity = ease((t - c0 - 1.2) / 0.4);
  };

  await document.fonts.ready;
  await Promise.all([...document.images].filter((img) => img.id !== 'src' && img.id !== 'appImg').map((img) => img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; })));
  if (!TL.app && !TL.still) $('phoneWrap').style.display = 'none';
  await window.render(0);
  window.READY = true;
})();
</script>
</body>
</html>
